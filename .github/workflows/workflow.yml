on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: write

defaults:
  run:
    shell: "bash -euo pipefail {0}"

jobs:
  build:
    name: Build all images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Signal build start to healthchecks.io
        if: github.ref == 'refs/heads/main'
        run: curl -fsS --retry 3 "${{ secrets.HEALTHCHECKS_IO_URL }}/start" || true


      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up dagger engine
        id: engine
        uses: ./.github/actions/dagger-engine
        with:
          age-key: ${{ secrets.AGE_KEY }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          s3-endpoint: ${{ secrets.S3_ENDPOINT }}
          s3-bucket: ${{ secrets.S3_BUCKET }}

      - name: Run Dagger Build
        uses: dagger/dagger-for-github@v8.4.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          _EXPERIMENTAL_DAGGER_RUNNER_HOST: container+docker://dagger-engine
        with:
          version: ${{ steps.engine.outputs.dagger-version }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          call: >-
            build
            --mok=file://./secrets/mok.key

      # Obtained from the module so future images are captured as well
      - name: Collect image names
        id: images
        env:
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          _EXPERIMENTAL_DAGGER_RUNNER_HOST: container+docker://dagger-engine
        run: |
          # dagger writes its progress log to stderr, so stdout is only the JSON array.
          images=$(dagger call image-names --mok=file://./secrets/mok.key)
          # An unusable value would otherwise surface as a matrix error in a job that has
          # none of this context.
          jq -e 'type == "array" and length > 0' <<<"$images" > /dev/null
          echo "images=$images" >> "$GITHUB_OUTPUT"

      # The cache is only consistent once the engine has flushed and exited, and the push
      # jobs restore it from S3 rather than from this runner.
      - name: Stop Dagger Engine
        if: always()
        run: docker stop dagger-engine -t 300

      # Only from main: Don't let PR branches overwrite the cache for everything else
      - name: Save Dagger Engine Cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        run: |
          if [ ! -d /var/lib/dagger ]; then
            echo "::error::/var/lib/dagger does not exist, nothing to save"
            exit 1
          fi

          # zstd gets 3.5x on snapshots and 1.008x on content, so the ratio of the two
          # is what decides how big the upload is. One walk, reported in MB.
          sudo du -sch /var/lib/dagger/worker/content /var/lib/dagger/worker/snapshots

          # The parts of an upload that never completed are billed like stored data, and
          # cancel-in-progress interrupts this step from time to time. Nothing else writes
          # this key while this run holds the concurrency group, so whatever is still open
          # here was left behind by an earlier run.
          if ! uploads=$(aws s3api list-multipart-uploads --bucket "$S3_BUCKET" --prefix "$KEY" --query 'Uploads[].UploadId' --output text 2>&1); then
            echo "::warning::Cannot list multipart uploads of s3://$S3_BUCKET/$KEY: $uploads"
            uploads=""
          fi
          if [ "$uploads" = "None" ]; then
            uploads=""
          fi
          for id in $uploads; do
            echo "Aborting leftover multipart upload $id"
            aws s3api abort-multipart-upload --bucket "$S3_BUCKET" --key "$KEY" --upload-id "$id"
          done

          # The upload length is unknown up front, so every part is buffered in memory:
          # this caps that at concurrency * chunksize.
          aws configure set default.s3.max_concurrent_requests 16
          aws configure set default.s3.multipart_chunksize 64MB

          sudo tar -c --numeric-owner --xattrs --xattrs-include='*' --sparse -C /var/lib/dagger . \
            | zstd -T0 \
            | aws s3 cp - "s3://$S3_BUCKET/$KEY" --only-show-errors

          # `aws s3 cp` can report a transfer error and still exit 0, so the upload is
          # only confirmed by reading the object back. Assigned rather than inlined
          # into echo, which would discard the exit status.
          size=$(aws s3api head-object --bucket "$S3_BUCKET" --key "$KEY" --query ContentLength --output text)
          echo "Uploaded $(numfmt --to=iec-i --suffix=B --format='%.1f' "$size") to s3://$S3_BUCKET/$KEY"

  push:
    name: Push ${{ matrix.image }}
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      # One image failing to push says nothing about the others.
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.build.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Restores the archive the build job just uploaded, so building the image below is
      # a cache hit and only the rechunk actually runs here.
      - name: Set up dagger engine
        id: engine
        uses: ./.github/actions/dagger-engine
        with:
          age-key: ${{ secrets.AGE_KEY }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
          s3-endpoint: ${{ secrets.S3_ENDPOINT }}
          s3-bucket: ${{ secrets.S3_BUCKET }}

      - name: Run Dagger Push
        uses: dagger/dagger-for-github@v8.4.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          _EXPERIMENTAL_DAGGER_RUNNER_HOST: container+docker://dagger-engine
        with:
          version: ${{ steps.engine.outputs.dagger-version }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          call: >-
            build-and-push
            --image-name=${{ matrix.image }}
            --mok=file://./secrets/mok.key
            --cosign-key=file://./secrets/cosign.key
            --revision=${{ github.sha }}
            --registry=ghcr.io
            --namespace=${{ github.repository_owner }}
            --username=${{ github.actor }}
            --password=env://GITHUB_TOKEN
            --is-pr=${{ github.event_name == 'pull_request' && 'true' || 'false' }}
            --pr-number="${{ github.event.pull_request.number }}"

  notify:
    name: Signal result to healthchecks.io
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    needs:
      - build
      - push
    runs-on: ubuntu-latest
    steps:
      - name: Signal build success to healthchecks.io
        if: ${{ needs.build.result == 'success' && needs.push.result == 'success' }}
        run: curl -fsS --retry 3 "${{ secrets.HEALTHCHECKS_IO_URL }}" || true

      - name: Signal build failure to healthchecks.io
        if: ${{ needs.build.result != 'success' || needs.push.result != 'success' }}
        run: curl -fsS --retry 3 "${{ secrets.HEALTHCHECKS_IO_URL }}/fail" || true
