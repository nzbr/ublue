on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "**/README.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  packages: write

jobs:
  dagger:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: "bash -euo pipefail {0}"
    env:
      # The AWS_* and S3_* values are deliberately not set here: they are trimmed and
      # exported by "Configure S3 access", and a job-level env would shadow that.
      KEY: ublue-dagger-engine.tar.zst
    steps:
      - name: Signal build start to healthchecks.io
        if: github.ref == 'refs/heads/main'
        run: curl -fsS --retry 3 "${{ secrets.HEALTHCHECKS_IO_URL }}/start" || true

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9

      - name: Checkout
        uses: actions/checkout@v7

      - name: Activate Nix environment
        uses: lukas-mertens/switch-into-nix-shell@v1.0.0

      - name: Detect dagger and dagger engine version
        id: dagger-version
        run: dagger version | sed -E 's|[^ ]+ ([^ ]+) \(image://([^\)]+)\) [^ ]+|version=\1\nengine-image=\2|' | tee -a $GITHUB_OUTPUT

      - name: Decrypt secrets
        run: |
          echo ${{ secrets.AGE_KEY }} | rage -d -i - -o ./secrets/mok.key ./secrets/mok.key.age
          echo ${{ secrets.AGE_KEY }} | rage -d -i - -o ./secrets/cosign.key ./secrets/cosign.key.age

      # A stray newline in a secret is invisible in the UI and surfaces as an unrelated
      # "Invalid header value" from the signer, so strip whitespace from all of them.
      # None of these values can legitimately contain any.
      - name: Configure S3 access
        env:
          RAW_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          RAW_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          RAW_AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
          RAW_AWS_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT }}
          RAW_S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION AWS_ENDPOINT_URL S3_BUCKET; do
            raw="RAW_$name"
            value=$(printf '%s' "${!raw}" | tr -d '[:space:]')
            if [ -z "$value" ]; then
              echo "::error::$name resolves to an empty value"
              exit 1
            fi
            # The registered mask covers the untrimmed secret, which may differ.
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done

      - name: Restore Dagger Engine Cache
        continue-on-error: true
        run: |
          # Probed separately so a miss doesn't tear down the pipeline below. The error
          # is echoed rather than swallowed: a bad credential is not a cache miss.
          if ! size=$(aws s3api head-object --bucket "$S3_BUCKET" --key "$KEY" --query ContentLength --output text 2>&1); then
            case "$size" in
              *404*|*"Not Found"*) echo "::notice::No engine cache at s3://$S3_BUCKET/$KEY, starting cold" ;;
              *) echo "::error::Cannot read s3://$S3_BUCKET/$KEY, starting cold: $size" ;;
            esac
            exit 0
          fi

          sudo mkdir -p /var/lib/dagger
          echo "Restoring $(numfmt --to=iec-i --suffix=B --format='%.1f' "$size") from s3://$S3_BUCKET/$KEY"
          aws s3 cp "s3://$S3_BUCKET/$KEY" - \
            | zstd -d \
            | sudo tar -x -p --numeric-owner --xattrs --xattrs-include='*' -C /var/lib/dagger

      - name: Start Dagger Engine
        run: >-
          docker run -d
          --name dagger-engine
          --privileged
          -v "/var/lib/dagger:/var/lib/dagger"
          -v "$PWD/dagger-engine.json:/etc/dagger/engine.json"
          "${{ steps.dagger-version.outputs.engine-image }}"

      - name: Run Dagger Build
        uses: dagger/dagger-for-github@v8.4.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          _EXPERIMENTAL_DAGGER_RUNNER_HOST: container+docker://dagger-engine
        with:
          version: ${{ steps.dagger-version.outputs.version }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          call: >-
            build
            --mok=file://./secrets/mok.key

      - name: Stop Dagger Engine
        if: always()
        run: docker stop dagger-engine -t 300

      # Only from main: Don't let PR branches overwrite the cache for everything else
      - name: Save Dagger Engine Cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        run: |
          if [ ! -d /var/lib/dagger ]; then
            echo "::error::/var/lib/dagger does not exist, nothing to save"
            exit 1
          fi

          # zstd gets 3.5x on snapshots and 1.008x on content, so the ratio of the two
          # is what decides how big the upload is. One walk, reported in MB.
          sudo du -sch /var/lib/dagger/worker/content /var/lib/dagger/worker/snapshots

          # The upload length is unknown up front, so every part is buffered in memory:
          # this caps that at concurrency * chunksize.
          aws configure set default.s3.max_concurrent_requests 16
          aws configure set default.s3.multipart_chunksize 64MB

          sudo tar -c --numeric-owner --xattrs --xattrs-include='*' --sparse -C /var/lib/dagger . \
            | zstd -T0 \
            | aws s3 cp - "s3://$S3_BUCKET/$KEY" --only-show-errors

          # `aws s3 cp` can report a transfer error and still exit 0, so the upload is
          # only confirmed by reading the object back. Assigned rather than inlined
          # into echo, which would discard the exit status.
          size=$(aws s3api head-object --bucket "$S3_BUCKET" --key "$KEY" --query ContentLength --output text)
          echo "Uploaded $(numfmt --to=iec-i --suffix=B --format='%.1f' "$size") to s3://$S3_BUCKET/$KEY"

      - name: Start Dagger Engine
        if: success() && github.ref == 'refs/heads/main'
        run: docker start dagger-engine

      - name: Run Dagger Push
        if: success() && github.ref == 'refs/heads/main'
        uses: dagger/dagger-for-github@v8.4.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DAGGER_CLOUD_TOKEN: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          _EXPERIMENTAL_DAGGER_RUNNER_HOST: container+docker://dagger-engine
        with:
          version: ${{ steps.dagger-version.outputs.version }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          call: >-
            build-and-push
            --mok=file://./secrets/mok.key
            --cosign-key=file://./secrets/cosign.key
            --revision=${{ github.sha }}
            --registry=ghcr.io
            --namespace=${{ github.repository_owner }}
            --username=${{ github.actor }}
            --password=env://GITHUB_TOKEN
            --is-pr=${{ github.event_name == 'pull_request' && 'true' || 'false' }}
            --pr-number="${{ github.event.pull_request.number }}"

      - name: Signal build success to healthchecks.io
        if: success() && github.ref == 'refs/heads/main'
        run: curl -fsS --retry 3 "${{ secrets.HEALTHCHECKS_IO_URL }}" || true

      - name: Signal build failure to healthchecks.io
        if: failure() && github.ref == 'refs/heads/main'
        run: curl -fsS --retry 3 "${{ secrets.HEALTHCHECKS_IO_URL }}/fail" || true
